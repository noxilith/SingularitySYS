# libnftnl: nftables netlink library. Headers and pkg-config file kept.
name        = "libnftnl"
version     = "1.3.2"
description = "Netlink programming interface to the Linux nf_tables subsystem"
license     = "GPL-2.0-or-later"
libc        = ["glibc"]

[depends]
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2",
         "which", "make", "binutils", "gcc", "glibc", "linux-headers", "pkgconf", "libmnl"]

[[source]]
url    = "https://www.netfilter.org/pub/libnftnl/libnftnl-1.3.2.tar.xz"
sha256 = "c97abc3409f8fa396b4462b2bb7f147a3a47a4ddc97cfa0b2f18890c9cfde8b0"

[build]
configure = "./configure --prefix=/usr --libdir=/usr/lib --disable-static --disable-dependency-tracking CFLAGS='-O2'"
compile   = "make -j$JOBS"
install   = '''
make install DESTDIR=$DESTDIR
rm -f "$DESTDIR"/usr/lib/*.la
test -f "$DESTDIR/usr/lib/libnftnl.so.11"
'''
