# GCC for glibc: C and C++ compilers with SHARED libgcc_s and libstdc++, built natively by the store's compiler in
# a sandbox with NO host tools (the stage-1 toolchain at first, itself later). This is the final `gcc` package;
# `gcc-glibc-stage1` only exists to bootstrap it.
#
# build = host = target, spelled identically, so configure treats this as a native build: unprefixed tool names
# (`gcc`, `g++`) and system paths taken from the machine (`/usr/include`, `/usr/lib`), with no sysroot. PIE and
# stack protector are the defaults for programs it compiles, as on any current distribution.
name        = "gcc"
version     = "14.2.0_r2"
description = "GNU Compiler Collection (C, C++) for x86_64-unknown-linux-gnu"
license     = "GPL-3.0-or-later WITH GCC-exception-3.1"
libc        = ["glibc"]

[depends]
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2",
         "which", "make", "binutils", "gcc", "glibc", "linux-headers", "zlib"]
run   = ["binutils", "glibc", "linux-headers"]

# $SRC is the first source: gcc itself.
[[source]]
url    = "https://ftp.gnu.org/gnu/gcc/gcc-14.2.0/gcc-14.2.0.tar.xz"
# Pinned from the first download (trust on first use); see gcc-glibc-stage1.
sha256 = "a7b39bc69cbf9e25826c5a60ab26477001f7c08d85cec04bc0e29cabed6f3cc9"

[[source]]
url    = "https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz"
sha256 = "a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898"

[[source]]
url    = "https://ftp.gnu.org/gnu/mpfr/mpfr-4.2.1.tar.xz"
sha256 = "277807353a6726978996945af13e52829e3abd7a9a5b7fb2793894e18f1fcbb2"

[[source]]
url    = "https://ftp.gnu.org/gnu/mpc/mpc-1.3.1.tar.gz"
sha256 = "ab642492f5cf882b74aa0cb730cd410a81edcdbec895183ce930e706c1c759b8"

[build]
prepare = '''
# gmp, mpfr and mpc inside the gcc source tree, so gcc builds them itself.
# (BusyBox tar: -o means "do not restore ownership", which is unmapped here.)
cd "$SRC"
tar -o -xf /sources/gmp-6.3.0.tar.xz && mv gmp-6.3.0 gmp
tar -o -xf /sources/mpfr-4.2.1.tar.xz && mv mpfr-4.2.1 mpfr
tar -o -xf /sources/mpc-1.3.1.tar.gz && mv mpc-1.3.1 mpc

# Merged /usr: libraries go in /usr/lib, not lib64, for gcc's driver and for what it installs.
sed -i 's|m64=\.\./lib64|m64=../lib|' "$SRC/gcc/config/i386/t-linux64"
remaining=$(grep -c 'm64=\.\./lib64' "$SRC/gcc/config/i386/t-linux64" || true)
if [ "$remaining" != 0 ]; then
    echo "could not switch gcc's 64-bit library directory to lib" >&2
    exit 1
fi
'''

# CFLAGS are -O2 with NO -g, on purpose: debug info records the compiler's own location, which in a store
# contains its package id, so binaries would differ between stages even when the code is identical.
configure = '''
mkdir -p /build/gcc-build
cd /build/gcc-build
"$SRC/configure" \
    --prefix=/usr \
    --build=x86_64-unknown-linux-gnu --host=x86_64-unknown-linux-gnu --target=x86_64-unknown-linux-gnu \
    --with-native-system-header-dir=/usr/include \
    --enable-languages=c,c++ \
    --disable-multilib --disable-nls --disable-bootstrap --disable-werror \
    --enable-shared --enable-default-pie --enable-default-ssp --enable-plugin --disable-lto \
    --with-system-zlib \
    --disable-libsanitizer --disable-libquadmath --disable-libcc1 \
    --disable-libitm --disable-libvtv --disable-libstdcxx-pch \
    --enable-threads=posix --enable-tls --enable-__cxa_atexit --enable-clocale=gnu \
    --with-arch=x86-64 --with-tune=generic \
    CFLAGS='-O2' CXXFLAGS='-O2' CFLAGS_FOR_TARGET='-O2' CXXFLAGS_FOR_TARGET='-O2' MAKEINFO=true
'''

compile = '''
cd /build/gcc-build
make -j"$JOBS" MAKEINFO=true
'''

install = '''
cd /build/gcc-build
make DESTDIR=$DESTDIR MAKEINFO=true install-strip

cd "$DESTDIR/usr/bin"
# The install makes hard links (gcc, x86_64-unknown-linux-gnu-gcc, ...); use symlinks so the package does not
# carry a compiler several times.
for alias in x86_64-unknown-linux-gnu-gcc x86_64-unknown-linux-gnu-gcc-14.2.0 cc; do ln -sf gcc "$alias"; done
for alias in c++ x86_64-unknown-linux-gnu-g++ x86_64-unknown-linux-gnu-c++; do ln -sf g++ "$alias"; done
rm -rf "$DESTDIR/usr/share/info" "$DESTDIR/usr/share/man" "$DESTDIR/usr/share/gdb"

# Self-checks: the driver and the target libraries must be where the driver looks for them.
test -f "$DESTDIR/usr/lib/gcc/x86_64-unknown-linux-gnu/14.2.0/libgcc.a"
test -f "$DESTDIR/usr/lib/libstdc++.a"
test -f "$DESTDIR/usr/lib/libstdc++.so.6"
test -f "$DESTDIR/usr/lib/libgcc_s.so.1"
test -x "$DESTDIR/usr/libexec/gcc/x86_64-unknown-linux-gnu/14.2.0/cc1plus"
'''
