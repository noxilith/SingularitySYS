# Lua: the scripting language WirePlumber's policy is written in. Only the shared library (liblua.so.5.4), headers
# and pkg-config files; compiled by hand because upstream's makefile only builds static libraries.
name        = "lua"
version     = "5.4.8"
description = "Lua scripting language library"
license     = "MIT"
libc        = ["glibc"]

[depends]
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2", "which", "make", "binutils", "gcc", "glibc", "linux-headers", "pkgconf"]

[[source]]
url    = "https://www.lua.org/ftp/lua-5.4.8.tar.gz"
sha256 = "4f18ddae154e793e46eeab727c59ef1c0c0c2b744e7b94219710d76f530629ae"

[build]
compile = '''
cd src
gcc -O2 -fPIC -shared -DLUA_USE_LINUX -DLUA_COMPAT_5_3 -Wl,-soname,liblua.so.5.4 -o liblua.so.5.4.8 $(ls *.c | grep -v -e '^lua\.c$' -e '^luac\.c$') -lm -ldl
'''
install = '''
d=$DESTDIR/usr
mkdir -p $d/lib/pkgconfig $d/include
install -m 755 src/liblua.so.5.4.8 $d/lib/
ln -s liblua.so.5.4.8 $d/lib/liblua.so.5.4
ln -s liblua.so.5.4.8 $d/lib/liblua.so
install -m 644 src/lua.h src/luaconf.h src/lualib.h src/lauxlib.h src/lua.hpp $d/include/
for n in lua lua-5.4 lua5.4; do
printf 'prefix=/usr\nlibdir=${prefix}/lib\nincludedir=${prefix}/include\n\nName: Lua\nDescription: Lua scripting language\nVersion: 5.4.8\nLibs: -L${libdir} -llua\nLibs.private: -lm -ldl\nCflags: -I${includedir}\n' > $d/lib/pkgconfig/$n.pc
done
test -e $d/lib/liblua.so.5.4
'''
