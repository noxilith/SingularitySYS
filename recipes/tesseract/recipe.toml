# OCR engine (copy text from the screen)
name        = "tesseract"
version     = "5.5.0"
description = "OCR engine (copy text from the screen)"
license     = "Apache-2.0"
libc        = ["glibc"]

[depends]
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2", "which", "make", "binutils", "gcc", "glibc", "linux-headers", "pkgconf", "cmake", "ninja", "leptonica", "libpng", "zlib"]

[[source]]
url    = "https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.0.tar.gz"
sha256 = "f2fb34ca035b6d087a42875a35a7a5c4155fa9979c6132365b1e5a28ebc3fc11"

[build]
configure = '''
cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DBUILD_SHARED_LIBS=ON -DSW_BUILD=OFF -DBUILD_TRAINING_TOOLS=OFF -DDISABLE_ARCHIVE=ON -DDISABLE_CURL=ON -DOPENMP_BUILD=OFF -DGRAPHICS_DISABLED=ON -DLeptonica_DIR=/usr/lib/cmake/leptonica -DBUILD_TESTS=OFF
'''
compile = "cmake --build build -j $JOBS"
install = '''
DESTDIR=$DESTDIR cmake --install build
rm -rf "$DESTDIR/usr/share/doc" "$DESTDIR/usr/share/man"
test -e "$DESTDIR/usr/bin/tesseract"
'''
