name        = "sed"
version     = "4.9"
description = "GNU sed"
license     = "GPL-3.0-or-later"
libc        = ["glibc"]

[depends]
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2",
         "which", "make", "binutils", "gcc", "glibc", "linux-headers"]

[[source]]
url    = "https://ftp.gnu.org/gnu/sed/sed-4.9.tar.xz"
sha256 = "6e226b732e1cd739464ad6862bd1a1aba42d7982922da7a53519631d24975181"

[build]
configure = '''
export FORCE_UNSAFE_CONFIGURE=1
./configure --prefix=/usr --disable-nls --disable-dependency-tracking CFLAGS='-O2 -std=gnu17'
'''
compile   = "make -j$JOBS"
install   = '''
make DESTDIR=$DESTDIR install
rm -rf "$DESTDIR/usr/share/man" "$DESTDIR/usr/share/info" "$DESTDIR/usr/share/locale" "$DESTDIR/usr/share/doc" "$DESTDIR/usr/lib/charset.alias"
for f in "$DESTDIR"/usr/bin/* "$DESTDIR"/usr/sbin/* "$DESTDIR"/usr/libexec/*; do
    [ -f "$f" ] && [ ! -L "$f" ] || continue
    strip "$f" 2>/dev/null || true
done
test "$(echo abc | "$DESTDIR/usr/bin/sed" s/b/X/)" = aXc
'''
