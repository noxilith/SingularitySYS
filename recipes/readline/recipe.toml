# GNU readline line-editing library
name        = "readline"
version     = "8.3_r1"
description = "GNU readline line-editing library"
license     = "GPL-3.0-or-later"
libc        = ["glibc"]

[depends]
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2", "which", "make", "binutils", "gcc", "glibc", "linux-headers", "pkgconf", "ncurses"]

[[source]]
url    = "https://mirrors.kernel.org/gnu/readline/readline-8.3.tar.gz"
sha256 = "fe5383204467828cd495ee8d1d3c037a7eba1389c22bc6a041f627976f9061cc"

[build]
configure = "./configure --prefix=/usr --libdir=/usr/lib --sysconfdir=/etc --localstatedir=/var --disable-static --disable-dependency-tracking --with-curses CFLAGS='-O2'"
compile   = "make -j$JOBS SHLIB_LIBS=-lncursesw"
install   = '''
make install DESTDIR=$DESTDIR SHLIB_LIBS=-lncursesw
rm -f "$DESTDIR"/usr/lib/*.la
rm -rf "$DESTDIR/usr/share/man" "$DESTDIR/usr/share/doc" "$DESTDIR/usr/share/info"

test -e "$DESTDIR/usr/lib/libreadline.so.8"
'''
