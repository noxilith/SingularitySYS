# Mako template library (pure Python, used when building Mesa)
name        = "python-mako"
version     = "1.3.10"
description = "Mako template library"
license     = "MIT"
libc        = ["glibc"]

[depends]
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2", "which", "python"]
run   = ["python", "python-markupsafe"]

[[source]]
url    = "https://files.pythonhosted.org/packages/source/m/mako/mako-1.3.10.tar.gz"
sha256 = "99579a6f39583fa7e5630a28c3c1f440e4e97a414b80372649c0ce338da2ea28"

[build]
install = '''
site="$DESTDIR/usr/lib/python3.12/site-packages"
mkdir -p "$site"
cp -R mako "$site/mako"
test -f "$site/mako/__init__.py"
'''
