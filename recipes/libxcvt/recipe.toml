# VESA CVT modeline library
name        = "libxcvt"
version     = "0.1.3"
description = "VESA CVT modeline library"
license     = "MIT"
libc        = ["glibc"]

[depends]
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2", "which", "make", "binutils", "gcc", "glibc", "linux-headers", "pkgconf", "python", "ninja", "meson"]

[[source]]
url    = "https://xorg.freedesktop.org/archive/individual/lib/libxcvt-0.1.3.tar.xz"
sha256 = "a929998a8767de7dfa36d6da4751cdbeef34ed630714f2f4a767b351f2442e01"

[build]
configure = '''
export PYTHONPATH=/usr/lib/python3.12/site-packages
CC=gcc CXX=g++ meson setup build --prefix=/usr --libdir=lib --sysconfdir=/etc --localstatedir=/var --buildtype=release 
'''
compile   = "export PYTHONPATH=/usr/lib/python3.12/site-packages; meson compile -C build -j $JOBS"
install   = '''
export PYTHONPATH=/usr/lib/python3.12/site-packages
DESTDIR=$DESTDIR meson install -C build
rm -rf "$DESTDIR/usr/share/doc" "$DESTDIR/usr/share/man" "$DESTDIR/var/run" "$DESTDIR/run"

test -e "$DESTDIR/usr/lib/libxcvt.so.0"
'''
