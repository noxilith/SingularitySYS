# Jinja2 templates: systemd's build renders its unit files with it.
name        = "python-jinja2"
version     = "3.1.6_r1"
description = "Jinja2 template engine"
license     = "BSD-3-Clause"
libc        = ["glibc"]

[depends]
build = ["busybox", "python"]
run   = ["python", "python-markupsafe"]

[[source]]
url    = "https://files.pythonhosted.org/packages/df/bf/f7da0350254c0ed7c72f3e33cef02e048281fec7ecec5f032d4aac52226b/jinja2-3.1.6.tar.gz"
sha256 = "0137fb05990d35f1275a587e9aee6d56da821fc83491a0fb838183be43f66d6d"

[build]
install = '''
site="$DESTDIR/usr/lib/python3.12/site-packages"
mkdir -p "$site"
cp -R src/jinja2 "$site/jinja2"
test -f "$site/jinja2/__init__.py"
'''
