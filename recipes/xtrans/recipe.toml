# X transport library (headers)
name        = "xtrans"
version     = "1.6.0"
description = "X transport library (headers)"
license     = "MIT"
libc        = ["glibc"]

[depends]
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2", "which", "make", "binutils", "gcc", "glibc", "linux-headers", "pkgconf", "xorgproto"]

[[source]]
url    = "https://xorg.freedesktop.org/archive/individual/lib/xtrans-1.6.0.tar.xz"
sha256 = "faafea166bf2451a173d9d593352940ec6404145c5d1da5c213423ce4d359e92"

[build]
configure = "export PYTHONPATH=/usr/lib/python3.12/site-packages; ./configure --prefix=/usr --libdir=/usr/lib --sysconfdir=/etc --localstatedir=/var --disable-static --disable-dependency-tracking --disable-specs --without-xmlto --without-fop --without-xsltproc --without-doxygen --disable-docs --disable-devel-docs CFLAGS='-O2'"
compile   = "make -j$JOBS"
install   = '''
make install DESTDIR=$DESTDIR
rm -f "$DESTDIR"/usr/lib/*.la
rm -rf "$DESTDIR/usr/share/man" "$DESTDIR/usr/share/doc" "$DESTDIR/usr/share/info"

test -e "$DESTDIR/usr/include/X11/Xtrans/Xtrans.h"
'''
