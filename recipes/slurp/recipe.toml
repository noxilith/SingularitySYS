# Select a region of a Wayland screen (screen sharing, screenshots)
name        = "slurp"
version     = "1.5.0_r1"
description = "Select a region of a Wayland screen (screen sharing, screenshots)"
license     = "MIT"
libc        = ["glibc"]

[depends]
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2", "which", "make", "binutils", "gcc", "glibc", "linux-headers", "pkgconf", "python", "ninja", "meson", "cairo", "libX11", "libXrender", "libXext", "xorgproto", "libxcb", "libXau", "libXdmcp", "wayland", "wayland-protocols", "libxkbcommon", "pixman", "freetype", "fontconfig", "libpng", "zlib", "expat"]

[[source]]
url    = "https://github.com/emersion/slurp/releases/download/v1.5.0/slurp-1.5.0.tar.gz"
sha256 = "eeb282b2adc8db5614b852596340b69da6f3954cf6cfbdc4392da509c934208a"

[build]
configure = '''
export PYTHONPATH=/usr/lib/python3.12/site-packages
CC=gcc CXX=g++ meson setup build --prefix=/usr --libdir=lib --sysconfdir=/etc --localstatedir=/var --buildtype=release -Dman-pages=disabled
'''
compile   = "export PYTHONPATH=/usr/lib/python3.12/site-packages; meson compile -C build -j $JOBS"
install   = '''
export PYTHONPATH=/usr/lib/python3.12/site-packages
DESTDIR=$DESTDIR meson install -C build
rm -rf "$DESTDIR/usr/share/doc" "$DESTDIR/usr/share/man" "$DESTDIR/var/run" "$DESTDIR/run"

test -e "$DESTDIR/usr/bin/slurp"
'''
