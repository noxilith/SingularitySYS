# Vesper: the desktop environment written in Rust (https://github.com/noxilith/VesperDE): a Wayland compositor with
# scrollable tiling, plus its bar, launcher, notifications, lock screen, settings and file manager. Built from the
# vendored source tarball of one commit that scripts/vendor-vesper.sh makes (a forge build has no network).
#
# Start it from a text console with `vesper-session` (needs a seat: systemd-logind, or `seatd` on OpenRC) or pick the
# "Vesper" session in a display manager. Installing it pulls in everything it uses: Xwayland, the screen-sharing portals,
# PipeWire and WirePlumber (volume), NetworkManager, BlueZ, brightnessctl, power-profiles-daemon, polkit, fonts, foot.
# Also: greetd (login screen), udisks2 (drives), tesseract (copy text from the screen), wf-recorder and ffmpeg (recording).
# Not packaged: the GTK portal backend (needs GTK).
name        = "vesper"
version     = "0.1.0_r14"
description = "Vesper desktop environment: Rust Wayland compositor with scrollable tiling"
license     = "GPL-3.0-or-later"
libc        = ["glibc"]

[depends]
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2", "which", "make", "binutils", "gcc", "glibc", "linux-headers", "pkgconf", "rust", "libxkbcommon", "libinput", "seatd", "libdrm", "mesa", "wayland", "systemd", "dbus", "linux-pam"]
run   = ["libxkbcommon", "xkeyboard-config", "libinput", "seatd", "libdrm", "mesa", "wayland", "dbus", "linux-pam",
         "systemd", "fontconfig", "freetype", "font-jetbrains-mono-nerd", "font-dejavu", "font-noto-color-emoji",
         "xwayland", "xdg-desktop-portal", "xdg-desktop-portal-wlr", "pipewire", "wireplumber", "slurp",
         "networkmanager", "bluez", "linux-firmware-bluetooth", "rtkit", "matugen", "brightnessctl", "power-profiles-daemon", "upower", "polkit", "foot", "greetd", "udisks2", "tesseract", "tesseract-data-eng", "wf-recorder", "libnotify", "ffmpeg"]

[[source]]
url    = "https://github.com/noxilith/SingularitySYS/releases/download/sources/vesper-25461df5117b76a33e748212fe2f88f1b480008e-vendored.tar.gz"
sha256 = "90d66cfcb08475bb346b0bad790f22b5fcf5c635066445a1d860aaff668d6859"

[build]
compile = '''
export HOME=/build CARGO_HOME=/build/cargo
cd "$SRC"
cargo build --release --frozen -j $JOBS
cargo build --release --frozen -j $JOBS --manifest-path file-manager/Cargo.toml
'''
install = '''
cd "$SRC"
make DESTDIR=$DESTDIR PREFIX=/usr install
# This system has no /etc/pam.d/login to include: check the password with pam_unix directly.
printf 'auth     required pam_unix.so\naccount  required pam_unix.so\n' > "$DESTDIR/etc/pam.d/vesper-lock"
# OpenRC: the seat daemon (systemd systems use logind instead). Enable it with: rc-update add seatd default
mkdir -p "$DESTDIR/etc/init.d"
printf '#!/sbin/openrc-run\ndescription="Seat management daemon"\ncommand=/usr/bin/seatd\ncommand_args="-g video"\ncommand_background=true\npidfile=/run/seatd.pid\n' > "$DESTDIR/etc/init.d/seatd"
chmod 755 "$DESTDIR/etc/init.d/seatd"
# Login screen: greetd (a dependency) runs Vesper's greeter on vt 7 (the text consoles on vt 1-6 stay free).
mkdir -p "$DESTDIR/etc/greetd" "$DESTDIR/usr/lib/tmpfiles.d"
printf '[terminal]\nvt = 7\n\n[default_session]\ncommand = "/usr/bin/vesper-greeter-session"\nuser = "greeter"\n' > "$DESTDIR/etc/greetd/config.toml"
cat > "$DESTDIR/usr/bin/vesper-greeter-session" <<'GREETER'
#!/bin/sh
# Run by greetd as the "greeter" user: Vesper's compositor showing only the login screen.
export XDG_SESSION_TYPE=wayland XDG_CURRENT_DESKTOP=Vesper LIBSEAT_BACKEND=seatd
export XDG_RUNTIME_DIR="${TMPDIR:-/tmp}/runtime-$(id -u)"
export XDG_CACHE_HOME="$XDG_RUNTIME_DIR/cache"; mkdir -p "$XDG_CACHE_HOME"
mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
exec vesper --tty --greeter >/tmp/vesper-greeter.log 2>&1
GREETER
chmod 755 "$DESTDIR/usr/bin/vesper-greeter-session"
# Keep the session's output in a log file even when it runs on a login-screen VT (sysreport collects it).
sed -i 's/^if \[ ! -t 1 \]; then/if [ ! -t 1 ] || [ -n "${XDG_VTNR:-}" ]; then/' "$DESTDIR/usr/bin/vesper-session"
grep -q XDG_VTNR "$DESTDIR/usr/bin/vesper-session"
printf 'd /var/cache/vesper-greeter 0755 greeter greeter -\nd /var/lib/greeter 0755 greeter greeter -\n' > "$DESTDIR/usr/lib/tmpfiles.d/vesper-greeter.conf"
mkdir -p "$DESTDIR/usr/lib/systemd/system"
printf '[Unit]\nDescription=Seat management daemon\n\n[Service]\nType=simple\nExecStart=/usr/bin/seatd -g video\nRestart=always\n\n[Install]\nWantedBy=multi-user.target\n' > "$DESTDIR/usr/lib/systemd/system/seatd.service"
# OpenRC has no user service manager: start the audio stack with the session (systemd starts it as user units).
cat > /build/audio-snippet <<'SNIP'
# Without logind (OpenRC) nothing creates /run/user/UID: fall back to a private directory in /tmp.
if [ ! -d "$XDG_RUNTIME_DIR" ] || [ ! -w "$XDG_RUNTIME_DIR" ]; then
    XDG_RUNTIME_DIR="${TMPDIR:-/tmp}/runtime-$(id -u)"
    mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
    export XDG_RUNTIME_DIR
fi
# One seat provider on both init systems: the seatd daemon (forge enables it when vesper is declared).
export LIBSEAT_BACKEND="${LIBSEAT_BACKEND:-seatd}"
# Start the audio stack with the session on both init systems (a login without logind has no user service manager).
for p in pipewire wireplumber pipewire-pulse; do
    if command -v "$p" >/dev/null 2>&1 && ! pgrep -u "$(id -u)" -x "$p" >/dev/null 2>&1; then "$p" >/dev/null 2>&1 & fi
done
SNIP
awk 'FNR==NR{s=s $0 "\n"; next} {print} /^export XDG_RUNTIME_DIR/{printf "%s", s}' /build/audio-snippet "$DESTDIR/usr/bin/vesper-session" > /build/vs && cat /build/vs > "$DESTDIR/usr/bin/vesper-session"
test -x "$DESTDIR/usr/bin/vesper"
test -x "$DESTDIR/usr/bin/vesper-session"
test -x "$DESTDIR/usr/bin/file-manager"
'''
