name        = "dash"
version     = "0.5.12_r1"
description = "Small POSIX shell (a fast /bin/sh)"
license     = "BSD-3-Clause"
libc        = ["glibc"]

[depends]
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2",
         "which", "make", "binutils", "gcc", "glibc", "linux-headers"]

[[source]]
url    = "http://gondor.apana.org.au/~herbert/dash/files/dash-0.5.12.tar.gz"
sha256 = "6a474ac46e8b0b32916c4c60df694c82058d3297d8b385b74508030ca4a8f28a"

[build]
configure = '''
export FORCE_UNSAFE_CONFIGURE=1
./configure --prefix=/usr --disable-dependency-tracking CFLAGS='-O2 -std=gnu17'
'''
compile   = "make -j$JOBS"
install   = '''
make DESTDIR=$DESTDIR install
rm -rf "$DESTDIR/usr/share/man" "$DESTDIR/usr/share/info" "$DESTDIR/usr/share/locale" "$DESTDIR/usr/share/doc" "$DESTDIR/usr/lib/charset.alias"
for f in "$DESTDIR"/usr/bin/* "$DESTDIR"/usr/sbin/* "$DESTDIR"/usr/libexec/*; do
    [ -f "$f" ] && [ ! -L "$f" ] || continue
    strip "$f" 2>/dev/null || true
done
# /bin/sh: the system shell. (BusyBox's applet link of the same name yields to this real file.)
ln -sf dash "$DESTDIR/usr/bin/sh"
test "$("$DESTDIR/usr/bin/dash" -c "echo ok")" = ok
'''
