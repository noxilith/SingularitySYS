# GNU which.
name        = "which"
version     = "2.21"
description = "GNU which"
license     = "GPL-3.0-or-later"
libc        = ["glibc"]

[depends]
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2",
         "which", "make", "binutils", "gcc", "glibc", "linux-headers"]

[[source]]
url    = "https://mirrors.kernel.org/gnu/which/which-2.21.tar.gz"
sha256 = "f4a245b94124b377d8b49646bf421f9155d36aa7614b6ebf83705d3ffc76eaad"

[build]
configure = "./configure --prefix=/usr CFLAGS='-O2'"
compile   = "make -j$JOBS"
install   = '''
make install DESTDIR=$DESTDIR
rm -rf "$DESTDIR/usr/share"
test -x "$DESTDIR/usr/bin/which"
'''
