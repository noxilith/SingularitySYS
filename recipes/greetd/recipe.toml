# greetd: the minimal login manager daemon. Ships the plain-text greeter `agreety` as the default screen; Vesper's own login
# screen is selected with the config in /usr/share/vesper/greetd-vesper.toml. Built from the vendored source tarball that
# scripts/vendor-crate.sh makes (a forge build has no network). Enable on OpenRC with: rc-update add greetd default
# (and stop any other login on vt1). Needs a user named "greeter" (declare it in system.toml or create it with useradd).
name        = "greetd"
version     = "0.10.3"
description = "Minimal and flexible login manager daemon"
license     = "GPL-3.0-or-later"
libc        = ["glibc"]

[depends]
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2", "which", "make", "binutils", "gcc", "glibc", "linux-headers", "pkgconf", "rust", "linux-pam"]
run   = ["linux-pam"]

[[source]]
url    = "https://github.com/noxilith/SingularitySYS/releases/download/sources/greetd-0.10.3-vendored.tar.gz"
sha256 = "b10ba66d36673a87b8576eeb90ebffd39ec739df3f106c3dfa17f6203ca5615f"

[build]
compile = '''
export HOME=/build CARGO_HOME=/build/cargo
cd "$SRC"
cargo build --release --frozen -j $JOBS -p greetd -p agreety
'''
install = '''
cd "$SRC"
install -Dm755 target/release/greetd "$DESTDIR/usr/bin/greetd"
install -Dm755 target/release/agreety "$DESTDIR/usr/bin/agreety"
install -Dm644 config.toml "$DESTDIR/etc/greetd/config.toml"
install -Dm644 greetd.service "$DESTDIR/usr/lib/systemd/system/greetd.service"
install -Dm644 LICENSE "$DESTDIR/usr/share/licenses/greetd/LICENSE"
mkdir -p "$DESTDIR/etc/pam.d" "$DESTDIR/etc/init.d" "$DESTDIR/usr/lib/sysusers.d"
printf 'auth     required pam_unix.so\naccount  required pam_unix.so\npassword required pam_unix.so\nsession  required pam_unix.so\n' > "$DESTDIR/etc/pam.d/greetd"
printf '#!/sbin/openrc-run\ndescription="greetd login manager"\ncommand=/usr/bin/greetd\ncommand_background=true\npidfile=/run/greetd.pid\ndepend() { need dbus seatd; }\n' > "$DESTDIR/etc/init.d/greetd"
chmod 755 "$DESTDIR/etc/init.d/greetd"
printf 'u greeter - "greetd greeter" /var/lib/greetd /usr/bin/nologin\n' > "$DESTDIR/usr/lib/sysusers.d/greetd.conf"
test -x "$DESTDIR/usr/bin/greetd"
'''
