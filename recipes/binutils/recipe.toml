# binutils for glibc: assembler, linker and friends, built natively by the store's compiler in a sandbox with NO
# host tools (the stage-1 toolchain at first, itself later). This is the final `binutils` package; the
# `binutils-glibc-stage1` one only bootstraps it.
#
# build = host = target, spelled identically, so configure treats this as a native build: unprefixed tool names
# (`ld`, `as`, ...) and no cross layout. Dynamically linked like every package; PIE by default.
name        = "binutils"
version     = "2.43.1_r1"
description = "GNU binutils for x86_64-unknown-linux-gnu (native)"
license     = "GPL-3.0-or-later"
libc        = ["glibc"]

[depends]
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2",
         "which", "make", "binutils", "gcc", "glibc", "linux-headers"]

[[source]]
url    = "https://ftp.gnu.org/gnu/binutils/binutils-2.43.1.tar.xz"
# Pinned from the first download (trust on first use); see binutils-glibc-stage1.
sha256 = "13f74202a3c4c51118b797a39ea4200d3f6cfbe224da6d1d95bb938480132dfd"

[build]
configure = '''
mkdir -p /build/binutils-build
cd /build/binutils-build
"$SRC/configure" \
    --prefix=/usr \
    --build=x86_64-unknown-linux-gnu --host=x86_64-unknown-linux-gnu --target=x86_64-unknown-linux-gnu \
    --disable-nls --disable-multilib --disable-werror --disable-gprofng \
    --disable-shared --enable-static --enable-plugins \
    --enable-deterministic-archives --enable-default-pie --enable-new-dtags --without-zstd \
    CC='gcc -std=gnu17' MAKEINFO=true
'''
compile = "cd /build/binutils-build && make -j$JOBS MAKEINFO=true"
install = '''
cd /build/binutils-build
make DESTDIR=$DESTDIR MAKEINFO=true install-strip
cd "$DESTDIR/usr/bin"
# The install makes hard links between usr/bin and usr/<triple>/bin; use symlinks so the package does not carry
# every tool twice.
T=x86_64-unknown-linux-gnu
if [ -d "$DESTDIR/usr/$T/bin" ]; then
    for f in "$DESTDIR"/usr/$T/bin/*; do
        name=$(basename "$f")
        rm -f "$f"
        ln -s "../../bin/$name" "$f"
    done
fi
rm -rf "$DESTDIR/usr/share/info" "$DESTDIR/usr/share/man"
test -x "$DESTDIR/usr/bin/ld" && test -x "$DESTDIR/usr/bin/as" && test -x "$DESTDIR/usr/bin/readelf"
'''
