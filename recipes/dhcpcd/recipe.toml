name        = "dhcpcd"
version     = "10.1.0"
description = "DHCP and IPv6 router-advertisement client"
license     = "BSD-2-Clause"
libc        = ["glibc"]

[depends]
build = ["busybox", "make", "binutils", "gcc", "glibc", "linux-headers"]

[[source]]
url    = "https://github.com/NetworkConfiguration/dhcpcd/releases/download/v10.1.0/dhcpcd-10.1.0.tar.xz"
sha256 = "abc307c63853da3199baa5c1e15fd5ede9d68d068b2a59ca14c5a6768e9cc3b7"

[build]
configure = "./configure --prefix=/usr --sbindir=/usr/sbin --libexecdir=/usr/libexec/dhcpcd --sysconfdir=/etc --dbdir=/var/lib/dhcpcd --runstatedir=/run --disable-privsep --without-udev --without-dev CFLAGS='-O2 -std=gnu17'"
compile   = "make -j$JOBS"
install   = '''
make DESTDIR=$DESTDIR install
rm -rf "$DESTDIR/usr/share" "$DESTDIR/var" "$DESTDIR/run" "$DESTDIR/usr/include" "$DESTDIR/usr/lib"
strip "$DESTDIR/usr/sbin/dhcpcd"
test -x "$DESTDIR/usr/sbin/dhcpcd"
'''
