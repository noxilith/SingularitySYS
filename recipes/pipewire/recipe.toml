# Audio and video server (screen sharing, sound)
name        = "pipewire"
version     = "1.4.7"
description = "Audio and video server (screen sharing, sound)"
license     = "MIT"
libc        = ["glibc"]

[depends]
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2", "which", "make", "binutils", "gcc", "glibc", "linux-headers", "pkgconf", "python", "ninja", "meson", "alsa-lib", "dbus", "systemd", "glib"]

[[source]]
url    = "https://gitlab.freedesktop.org/pipewire/pipewire/-/archive/1.4.7/pipewire-1.4.7.tar.gz"
sha256 = "9d54f025e1e7ae73b980a6c8be2e8e6387e24d554d58478d6495734ce1ee5a93"

[build]
configure = '''
export PYTHONPATH=/usr/lib/python3.12/site-packages
CC=gcc CXX=g++ meson setup build --prefix=/usr --libdir=lib --sysconfdir=/etc --localstatedir=/var --buildtype=release -Dtests=disabled -Dexamples=disabled -Ddocs=disabled -Dman=disabled -Dsystemd=enabled -Dsession-managers=[] -Dbluez5=disabled -Djack=disabled -Dpipewire-jack=disabled -Dgstreamer=disabled -Dsndfile=disabled -Dvulkan=disabled -Dlibcamera=disabled -Dv4l2=disabled -Dpipewire-v4l2=disabled -Dlibusb=disabled -Dlv2=disabled -Davahi=disabled -Dflatpak=disabled -Dopus=disabled -Dlibpulse=disabled -Dreadline=disabled -Draop=disabled -Dsdl2=disabled -Dselinux=disabled -Dx11=disabled -Dx11-xfixes=disabled -Dlibmysofa=disabled -Dpw-cat=disabled -Dvideotestsrc=disabled -Dvideoconvert=enabled -Dcompress-offload=disabled -Dgsettings=disabled -Dsupport=enabled -Dlogind=enabled
'''
compile   = "export PYTHONPATH=/usr/lib/python3.12/site-packages; meson compile -C build -j $JOBS"
install   = '''
export PYTHONPATH=/usr/lib/python3.12/site-packages
DESTDIR=$DESTDIR meson install -C build
rm -rf "$DESTDIR/usr/share/doc" "$DESTDIR/usr/share/man" "$DESTDIR/var/run" "$DESTDIR/run"

test -e "$DESTDIR/usr/lib/libpipewire-0.3.so.0"
'''
