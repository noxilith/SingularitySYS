# GNU patch: applies a diff to files.
name        = "patch"
version     = "2.8.1"
description = "GNU patch: apply a diff file to an original"
license     = "GPL-3.0-or-later"
libc        = ["glibc"]

[depends]
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2",
         "which", "make", "binutils", "gcc", "glibc", "linux-headers"]

[[source]]
url    = "https://ftpmirror.gnu.org/gnu/patch/patch-2.8.1.tar.xz"
sha256 = "3240c7959c5347c8ed347e3c4201c0337bf4240d5cf09d68889e58eeaba30e17"

[build]
configure = "./configure --prefix=/usr --disable-dependency-tracking CFLAGS='-O2'"
compile   = "make -j$JOBS"
install   = '''
make install DESTDIR=$DESTDIR
strip "$DESTDIR/usr/bin/patch" 2>/dev/null || true
test -x "$DESTDIR/usr/bin/patch"
'''
