# glibc, the system C library, built by the store's own compiler (the stage-1 toolchain at first, itself later).
# Merged-/usr layout: libraries and the dynamic loader live in /usr/lib, and the package ships /lib and /lib64 as
# symlinks to usr/lib, so the loader path every glibc program asks for (/lib64/ld-linux-x86-64.so.2) exists.
#
# Not in this package: /etc (system configuration is the system declaration's business: nsswitch.conf, ld.so.conf
# and friends are written by the image builder and by `forge apply`), locales beyond the built-in C.UTF-8 (the
# `glibc-locales` package), time zones (`tzdata`).
name        = "glibc"
version     = "2.42_r1"
description = "The GNU C library"
license     = "LGPL-2.1-or-later"
libc        = ["glibc"]

[depends]
# glibc builds against the glibc that is already there (its helper programs link with it), so it names itself.
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2",
         "which", "make", "binutils", "gcc", "glibc", "linux-headers", "python", "bison"]

[[source]]
url    = "https://ftpmirror.gnu.org/gnu/glibc/glibc-2.42.tar.xz"
# Pinned from the first download (trust on first use); the GNU mirror publishes only a PGP signature.
sha256 = "d1775e32e4628e64ef930f435b67bb63af7599acb6be2b335b9f19f16509f17f"

[build]
configure = '''
mkdir -p /build/glibc-build
cd /build/glibc-build
cat > configparms <<CFG
slibdir=/usr/lib
rtlddir=/usr/lib
sbindir=/usr/bin
rootsbindir=/usr/bin
CFG
"$SRC/configure" \
    --prefix=/usr --libdir=/usr/lib --libexecdir=/usr/lib/glibc \
    --sysconfdir=/etc --localstatedir=/var \
    --enable-kernel=4.19 --enable-stack-protector=strong \
    --disable-werror --disable-nscd --disable-profile --disable-crypt \
    --without-gd --without-selinux --with-headers=/usr/include \
    CFLAGS='-O2 -pipe' libc_cv_slibdir=/usr/lib
'''
compile = "cd /build/glibc-build && make -j$JOBS"
install = '''
cd /build/glibc-build
make install_root=$DESTDIR install
# Merged /usr: the paths programs and gcc expect, as symlinks.
ln -s usr/lib "$DESTDIR/lib"
ln -s usr/lib "$DESTDIR/lib64"
rm -rf "$DESTDIR/usr/share/info" "$DESTDIR/usr/share/man" "$DESTDIR/usr/share/locale" "$DESTDIR/var" "$DESTDIR/etc"
for f in "$DESTDIR"/usr/lib/*.so* "$DESTDIR"/usr/lib/gconv/*.so; do
    if [ -f "$f" ] && [ ! -L "$f" ]; then strip --strip-debug "$f" 2>/dev/null || true; fi
done
test -x "$DESTDIR/usr/lib/ld-linux-x86-64.so.2"
test -f "$DESTDIR/usr/lib/libc.so.6" && test -f "$DESTDIR/usr/include/stdio.h"
"$DESTDIR/usr/lib/libc.so.6" | head -n 1 | grep -q "release version 2.42"
'''
