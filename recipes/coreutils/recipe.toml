name        = "coreutils"
version     = "9.5"
description = "GNU core utilities (ls, cp, mv, cat, ...), one static binary with a symlink per command"
license     = "GPL-3.0-or-later"
libc        = ["glibc"]

[depends]
build = ["busybox", "make", "binutils", "gcc", "glibc", "linux-headers"]

[[source]]
url    = "https://ftp.gnu.org/gnu/coreutils/coreutils-9.5.tar.xz"
sha256 = "cd328edeac92f6a665de9f323c93b712af1858bc2e0d88f3f7100469470a1b8a"

[build]
configure = '''
export FORCE_UNSAFE_CONFIGURE=1
./configure --prefix=/usr --disable-nls --disable-dependency-tracking --enable-single-binary=symlinks --disable-libcap --without-gmp --without-selinux CFLAGS='-O2 -std=gnu17'
'''
compile   = "make -j$JOBS"
install   = '''
make DESTDIR=$DESTDIR install
rm -rf "$DESTDIR/usr/share/man" "$DESTDIR/usr/share/info" "$DESTDIR/usr/share/locale" "$DESTDIR/usr/share/doc" "$DESTDIR/usr/lib/charset.alias"
for f in "$DESTDIR"/usr/bin/* "$DESTDIR"/usr/sbin/* "$DESTDIR"/usr/libexec/*; do
    [ -f "$f" ] && [ ! -L "$f" ] || continue
    strip "$f" 2>/dev/null || true
done
"$DESTDIR/usr/bin/ls" --version | head -n 1 | grep -q "GNU coreutils"
'''
