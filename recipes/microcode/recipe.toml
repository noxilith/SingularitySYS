# CPU microcode: the vendors' updates for AMD (from linux-firmware) and Intel (the Intel-Linux-Processor-Microcode-Data-
# Files release), for the CPU bugs that are fixed that way (the RDSEED fault of early Zen 5 chips, security fixes).
# The kernel loads microcode before anything else, so besides the files in /usr/lib/firmware this package builds an
# "early" image, /usr/lib/microcode/early-<vendor>.cpio, which forge puts in /boot/microcode.img and Limine hands to the kernel
# as an extra initrd. It is updated with `forge upgrade` like any package; the new microcode is used from the next boot.
name        = "microcode"
version     = "20261110_r2"
description = "AMD and Intel CPU microcode, with an early-loading image for the boot loader"
license     = "Redistributable firmware (see /usr/share/licenses/microcode)"
libc        = ["glibc"]

[depends]
build = ["busybox"]

# The first source is unpacked as the source tree: linux-firmware, for amd-ucode.
[[source]]
url    = "https://cdn.kernel.org/pub/linux/kernel/firmware/linux-firmware-20261019.tar.xz"
sha256 = "a10d1ab5baf2c74ba92e8c7cf313e691696c26bddfa6df00db795e48d70cd4ca"

[[source]]
url    = "https://github.com/intel/Intel-Linux-Processor-Microcode-Data-Files/archive/refs/tags/microcode-20261110.tar.gz"
sha256 = "989a5cd345808babee491da69ed80ae5741697bc87743a71d0ba611f3fd6afa5"

[build]
install = '''
fw="$DESTDIR/usr/lib/firmware"
mkdir -p "$fw/amd-ucode" "$fw/intel-ucode" "$DESTDIR/usr/lib/microcode" "$DESTDIR/usr/share/licenses/microcode"
cp amd-ucode/microcode_amd*.bin "$fw/amd-ucode/"
cp LICENSES/LICENSE.amd-ucode "$DESTDIR/usr/share/licenses/microcode/"

mkdir -p /build/intel && cd /build/intel
tar -xzf /sources/microcode-20261110.tar.gz
cp Intel-Linux-Processor-Microcode-Data-Files-microcode-20261110/intel-ucode/* "$fw/intel-ucode/"
cp Intel-Linux-Processor-Microcode-Data-Files-microcode-20261110/license "$DESTDIR/usr/share/licenses/microcode/LICENSE.intel-ucode" 2>/dev/null || true

# The early images: a plain (uncompressed) cpio with the microcode where the kernel looks for it before it mounts
# anything. AMD wants every family file in one container, Intel every file in one. One image per vendor: forge uses
# the one for the machine's CPU, so the boot loader hands over 0.3 MB on AMD and 19 MB on Intel.
mkdir -p /build/early/kernel/x86/microcode && cd /build/early
cat "$fw"/amd-ucode/microcode_amd*.bin > kernel/x86/microcode/AuthenticAMD.bin
cat "$fw"/intel-ucode/* > kernel/x86/microcode/GenuineIntel.bin
out="$DESTDIR/usr/lib/microcode"
mkdir -p /build/early-amd/kernel/x86/microcode /build/early-intel/kernel/x86/microcode
cp kernel/x86/microcode/AuthenticAMD.bin /build/early-amd/kernel/x86/microcode/
cp kernel/x86/microcode/GenuineIntel.bin /build/early-intel/kernel/x86/microcode/
(cd /build/early-amd && find kernel | cpio -o -H newc > "$out/early-amd.cpio")
(cd /build/early-intel && find kernel | cpio -o -H newc > "$out/early-intel.cpio")
test -s "$out/early-amd.cpio" && test -s "$out/early-intel.cpio"
# Intel's loose files would only repeat what the early image holds (16 MB).
rm -rf "$fw/intel-ucode"
test -s "$fw/amd-ucode/microcode_amd_fam19h.bin"

'''
