# strace: traces the system calls of a program.
name        = "strace"
version     = "7.3"
description = "Trace system calls and signals"
license     = "LGPL-2.1-or-later"
libc        = ["glibc"]

[depends]
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2",
         "which", "make", "binutils", "gcc", "glibc", "linux-headers"]

[[source]]
url    = "https://github.com/strace/strace/releases/download/v7.3/strace-7.3.tar.xz"
sha256 = "529634c40910895a9a1f3c5c1e65da2ca9ed72fb158dfc4bcc89efdf05e39b72"

[build]
configure = "./configure --prefix=/usr --enable-mpers=no --disable-dependency-tracking CFLAGS='-O2'"
compile   = "make -j$JOBS"
install   = '''
make install DESTDIR=$DESTDIR
strip "$DESTDIR/usr/bin/strace" 2>/dev/null || true
test -x "$DESTDIR/usr/bin/strace"
'''
