# Filesystem in Userspace library and fusermount3
name        = "fuse3"
version     = "3.17.2"
description = "Filesystem in Userspace library and fusermount3"
license     = "LGPL-2.1-only"
libc        = ["glibc"]

[depends]
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2", "which", "make", "binutils", "gcc", "glibc", "linux-headers", "pkgconf", "python", "ninja", "meson", "systemd"]

[[source]]
url    = "https://github.com/libfuse/libfuse/releases/download/fuse-3.17.2/fuse-3.17.2.tar.gz"
sha256 = "3d932431ad94e86179e5265cddde1d67aa3bb2fb09a5bd35c641f86f2b5ed06f"

[build]
configure = '''
export PYTHONPATH=/usr/lib/python3.12/site-packages
CC=gcc CXX=g++ meson setup build --prefix=/usr --libdir=lib --sysconfdir=/etc --localstatedir=/var --buildtype=release -Dexamples=false -Dtests=false -Duseroot=false -Dudevrulesdir=/usr/lib/udev/rules.d -Dinitscriptdir=
'''
compile   = "export PYTHONPATH=/usr/lib/python3.12/site-packages; meson compile -C build -j $JOBS"
install   = '''
export PYTHONPATH=/usr/lib/python3.12/site-packages
DESTDIR=$DESTDIR meson install -C build
rm -rf "$DESTDIR/usr/share/doc" "$DESTDIR/usr/share/man" "$DESTDIR/var/run" "$DESTDIR/run"
rm -rf "$DESTDIR/etc/init.d" "$DESTDIR/usr/share/man"
test -e "$DESTDIR/usr/lib/libfuse3.so.4"
'''
