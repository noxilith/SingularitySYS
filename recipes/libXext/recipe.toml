# X11 miscellaneous extensions library
name        = "libXext"
version     = "1.3.6"
description = "X11 miscellaneous extensions library"
license     = "MIT"
libc        = ["glibc"]

[depends]
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2", "which", "make", "binutils", "gcc", "glibc", "linux-headers", "pkgconf", "xorgproto", "libX11", "libxcb", "libXau", "libXdmcp"]
run   = ["libX11"]

[[source]]
url    = "https://xorg.freedesktop.org/archive/individual/lib/libXext-1.3.6.tar.xz"
sha256 = "edb59fa23994e405fdc5b400afdf5820ae6160b94f35e3dc3da4457a16e89753"

[build]
configure = "export PYTHONPATH=/usr/lib/python3.12/site-packages; ./configure --prefix=/usr --libdir=/usr/lib --sysconfdir=/etc --localstatedir=/var --disable-static --disable-dependency-tracking --disable-specs --without-xmlto --without-fop --without-xsltproc --without-doxygen --disable-docs CFLAGS='-O2'"
compile   = "make -j$JOBS"
install   = '''
make install DESTDIR=$DESTDIR
rm -f "$DESTDIR"/usr/lib/*.la
rm -rf "$DESTDIR/usr/share/man" "$DESTDIR/usr/share/doc" "$DESTDIR/usr/share/info"

test -e "$DESTDIR/usr/lib/libXext.so.6"
'''
