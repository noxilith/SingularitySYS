# The parts of util-linux the installer uses: cfdisk, fdisk, sfdisk, blkid, lsblk, wipefs,
# plus the static libuuid and libblkid that btrfs-progs links. Everything else is off.
# Programs BusyBox also has (fdisk, blkid, ...) win over its applet links in the live image.
name        = "util-linux"
version     = "2.40.2_r4"
description = "Disk partitioning and block device tools (cfdisk, fdisk, sfdisk, blkid, lsblk, agetty, wipefs)"
license     = "GPL-2.0-or-later"
libc        = ["glibc"]

[depends]
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2",
         "which", "make", "binutils", "gcc", "glibc", "linux-headers", "ncurses", "zlib", "libxcrypt"]

[[source]]
url    = "https://cdn.kernel.org/pub/linux/utils/util-linux/v2.40/util-linux-2.40.2.tar.xz"
sha256 = "d78b37a66f5922d70edf3bdfb01a6b33d34ed3c3cafd6628203b2a2b67c8e8b3"

[build]
configure = '''
# Everything util-linux builds by default (mount, umount, swapon, losetup, dmesg, findmnt, script, flock, taskset, ...)
# except what other packages own or needs PAM: login, su, runuser, chfn/chsh, newgrp, vipw and nologin come from
# shadow, and setpriv needs libcap-ng. (Most programs have no --enable switch of their own, so the list is of what to leave out.)
./configure --prefix=/usr --bindir=/usr/bin --sbindir=/usr/sbin --libdir=/usr/lib --enable-usrdir-path --enable-shared --enable-static \
    --disable-login --disable-su --disable-runuser --disable-chfn-chsh --disable-newgrp --disable-vipw --disable-nologin \
    --disable-setpriv --disable-pylibmount --disable-liblastlog2 --disable-lslogins --disable-chmem --disable-lsmem \
    --with-ncursesw --without-python --without-systemd --without-udev --without-readline --without-tinfo \
    --disable-nls --disable-bash-completion --disable-asciidoc --disable-poman \
    --disable-makeinstall-chown --disable-makeinstall-setuid --disable-dependency-tracking \
    NCURSESW_CFLAGS='-I/usr/include' NCURSESW_LIBS='-lncursesw -ltinfow' \
    CFLAGS='-O2'
'''
compile   = "make -j$JOBS"
install   = '''
make DESTDIR=$DESTDIR install
rm -rf "$DESTDIR/usr/share/doc" "$DESTDIR/usr/share/bash-completion"
rm -f "$DESTDIR"/usr/lib/*.la
# The programs the system relies on must all be there; strip them. (A missing one names itself.)
missing=""
for b in cfdisk fdisk sfdisk blkid wipefs lsblk agetty mount umount swapon swapoff losetup dmesg hwclock findmnt mountpoint fsck sulogin kill more script logger flock setsid taskset getopt hexdump; do
    f=$(ls "$DESTDIR"/usr/sbin/$b "$DESTDIR"/usr/bin/$b "$DESTDIR"/bin/$b "$DESTDIR"/sbin/$b 2>/dev/null | head -1)
    if [ -n "$f" ]; then strip "$f" 2>/dev/null || true; else missing="$missing $b"; fi
done
if [ -n "$missing" ]; then
    echo "util-linux did not build:$missing" >&2
    echo "installed in usr/bin: $(ls "$DESTDIR"/usr/bin | tr '\n' ' ')" >&2
    echo "installed in usr/sbin: $(ls "$DESTDIR"/usr/sbin | tr '\n' ' ')" >&2
    exit 1
fi
test -f "$DESTDIR/usr/lib/libblkid.a" && test -f "$DESTDIR/usr/lib/libuuid.a"
test -f "$DESTDIR/usr/lib/libblkid.so.1" && test -f "$DESTDIR/usr/lib/libuuid.so.1"
'''
