# libelf from elfutils 0.197, and only the library: it is what the kernel's objtool needs. glibc has the argp,
# fts and obstack the rest of elfutils wants, but nothing else of elfutils is needed here, so only lib/ and
# libelf/ are built. libelf.pc carries -lz because libelf uses zlib for compressed sections and
# `pkg-config --libs libelf` is what objtool asks.
name        = "libelf"
version     = "0.197"
description = "ELF object file access library"
license     = "LGPL-3.0-or-later OR GPL-2.0-or-later"
libc        = ["glibc"]

[depends]
build = ["busybox", "make", "binutils", "gcc", "glibc", "linux-headers", "zlib", "pkgconf"]

[[source]]
url    = "https://sourceware.org/elfutils/ftp/0.197/elfutils-0.197.tar.bz2"
sha256 = "1fdf525f22dcf796d99a99ba3ea00a1f7b1ae5421bc62e8443a708920b99b904"

[build]
configure = '''
./configure --prefix=/usr --disable-nls --disable-debuginfod --disable-libdebuginfod --disable-demangler \
    --without-bzlib --without-lzma --without-zstd CFLAGS='-O2 -std=gnu17 -D_GNU_SOURCE -Wno-error'
'''
compile = '''
make -C lib -j$JOBS
make -C libelf -j$JOBS
'''
install = '''
make -C libelf DESTDIR=$DESTDIR install
mkdir -p "$DESTDIR/usr/lib/pkgconfig"
sed -e 's|^Libs: .*|Libs: -L${libdir} -lelf -lz|' config/libelf.pc > "$DESTDIR/usr/lib/pkgconfig/libelf.pc"
rm -f "$DESTDIR"/usr/lib/*.la
test -f "$DESTDIR/usr/lib/libelf.a"
test -f "$DESTDIR/usr/lib/libelf.so.1"
grep -q -- '-lz' "$DESTDIR/usr/lib/pkgconfig/libelf.pc"
'''
