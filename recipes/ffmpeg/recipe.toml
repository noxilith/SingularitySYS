# Audio and video tools and libraries (screen recording, thumbnails)
name        = "ffmpeg"
version     = "7.1.1"
description = "Audio and video tools and libraries (screen recording, thumbnails)"
license     = "GPL-2.0-or-later"
libc        = ["glibc"]

[depends]
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2", "which", "make", "binutils", "gcc", "glibc", "linux-headers", "pkgconf", "nasm", "x264", "zlib"]

[[source]]
url    = "https://ffmpeg.org/releases/ffmpeg-7.1.1.tar.xz"
sha256 = "733984395e0dbbe5c046abda2dc49a5544e7e0e1e2366bba849222ae9e3a03b1"

[build]
configure = "export PYTHONPATH=/usr/lib/python3.12/site-packages; ./configure --prefix=/usr --libdir=/usr/lib --enable-gpl --enable-libx264 --enable-shared --disable-doc --disable-debug --disable-ffplay --disable-vulkan --disable-xlib --disable-sdl2 --disable-autodetect --enable-zlib --enable-pic"
compile   = "make -j$JOBS"
install   = '''
make install DESTDIR=$DESTDIR
rm -f "$DESTDIR"/usr/lib/*.la
rm -rf "$DESTDIR/usr/share/man" "$DESTDIR/usr/share/doc" "$DESTDIR/usr/share/info"

test -e "$DESTDIR/usr/bin/ffmpeg"
'''
