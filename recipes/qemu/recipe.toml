# QEMU, x86-64 system emulator with KVM, headless (serial console, VNC off, no GUI): what is needed to boot-test the
# ISO and an installed system without real hardware. Builds the tools too (qemu-img). No network back end (no slirp).
name        = "qemu"
version     = "11.1.3"
description = "QEMU x86-64 system emulator (headless) and qemu-img"
license     = "GPL-2.0-only"
libc        = ["glibc"]

[depends]
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2",
         "which", "make", "binutils", "gcc", "glibc", "linux-headers", "pkgconf", "python", "ninja", "meson", "glib",
         "pixman", "zlib", "libffi", "pcre2"]

[[source]]
url    = "https://download.qemu.org/qemu-11.1.3.tar.xz"
sha256 = "5a8289c7940dc77d3873c81a6c29ba3afe1446fc9d36e77fa1658cdbecb84b22"

[build]
configure = '''
export PYTHONPATH=/usr/lib/python3.12/site-packages
# the tooling group (qemu.qmp, setuptools, wheel) is only for QEMU's own test scripts and cannot be fetched offline
sed -i "s/pythondeps.toml tooling || exit 1/pythondeps.toml tooling || true/" configure
./configure --prefix=/usr --libdir=lib --target-list=x86_64-softmmu --without-default-features --enable-kvm --enable-tcg \
    --enable-system --enable-tools --disable-docs --disable-download --disable-werror
'''
compile = "export PYTHONPATH=/usr/lib/python3.12/site-packages; make -j$JOBS"
install = '''
export PYTHONPATH=/usr/lib/python3.12/site-packages
make install DESTDIR=$DESTDIR
rm -rf "$DESTDIR/usr/share/doc" "$DESTDIR/usr/share/man" "$DESTDIR/usr/include"
strip "$DESTDIR/usr/bin/qemu-system-x86_64" "$DESTDIR/usr/bin/qemu-img" 2>/dev/null || true
test -x "$DESTDIR/usr/bin/qemu-system-x86_64"
'''
