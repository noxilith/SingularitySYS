# Direct Rendering Manager library
name        = "libdrm"
version     = "2.4.131"
description = "Direct Rendering Manager library"
license     = "MIT"
libc        = ["glibc"]

[depends]
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2", "which", "make", "binutils", "gcc", "glibc", "linux-headers", "pkgconf", "python", "ninja", "meson", "libpciaccess"]

[[source]]
url    = "https://dri.freedesktop.org/libdrm/libdrm-2.4.131.tar.xz"
sha256 = "45ba9983b51c896406a3d654de81d313b953b76e6391e2797073d543c5f617d5"

[build]
configure = '''
export PYTHONPATH=/usr/lib/python3.12/site-packages
CC=gcc meson setup build --prefix=/usr --libdir=lib --buildtype=release -Dtests=false -Dman-pages=disabled -Dvalgrind=disabled -Dcairo-tests=disabled -Dudev=false -Dintel=enabled -Dradeon=enabled -Damdgpu=enabled -Dnouveau=enabled
'''
compile   = "export PYTHONPATH=/usr/lib/python3.12/site-packages; meson compile -C build -j $JOBS"
install   = '''
export PYTHONPATH=/usr/lib/python3.12/site-packages
DESTDIR=$DESTDIR meson install -C build
rm -rf "$DESTDIR/usr/share/doc" "$DESTDIR/usr/share/man"
test -e "$DESTDIR/usr/lib/libdrm.so.2"
'''
