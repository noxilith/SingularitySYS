# nftables: the `nft` program that loads firewall rules. forge writes /etc/nftables.conf from the [firewall] section of the
# declaration and runs it at boot. No interactive CLI, JSON or iptables compatibility.
name        = "nftables"
version     = "1.1.7_r1"
description = "nftables packet filtering (nft)"
license     = "GPL-2.0-only"
libc        = ["glibc"]

[depends]
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2",
         "which", "make", "binutils", "gcc", "glibc", "linux-headers", "pkgconf", "libmnl", "libnftnl", "bison",
         "flex"]

[[source]]
url    = "https://www.netfilter.org/pub/nftables/nftables-1.1.7.tar.xz"
sha256 = "a6fbf060d8d4fff001517a2b94f356bb4366bfbf0ba366366f9d27cc38caa58f"

[build]
configure = '''
./configure --prefix=/usr --sbindir=/usr/sbin --sysconfdir=/etc --libdir=/usr/lib --disable-static --without-cli --without-json \
    --without-xtables --disable-man-doc --disable-python --disable-debug --with-mini-gmp --disable-dependency-tracking CFLAGS='-O2'
'''
compile = "make -j$JOBS"
install = '''
make install DESTDIR=$DESTDIR
rm -rf "$DESTDIR/etc" "$DESTDIR/usr/include" "$DESTDIR/usr/lib/pkgconfig"
find "$DESTDIR/usr/share" -mindepth 1 -maxdepth 1 ! -name man -exec rm -rf {} + 2>/dev/null || true
rm -f "$DESTDIR"/usr/lib/*.la
strip "$DESTDIR/usr/sbin/nft" 2>/dev/null || true
test -x "$DESTDIR/usr/sbin/nft"
'''
