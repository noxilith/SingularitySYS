# Linux-PAM: the pluggable authentication library the lock screen (and other programs that check a password) use.
# pam_unix checks passwords against /etc/shadow through the setuid helper unix_chkpwd (forge sets its mode). No
# logind, audit, SELinux, libeconf, OpenSSL or database modules; modules in /usr/lib/security, helper in /usr/bin.
name        = "linux-pam"
version     = "1.7.1"
description = "Linux Pluggable Authentication Modules"
license     = "BSD-3-Clause OR GPL-2.0-or-later"
libc        = ["glibc"]

[depends]
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2",
         "which", "make", "binutils", "gcc", "glibc", "linux-headers", "pkgconf", "python", "ninja", "meson", "flex",
         "bison", "m4", "libxcrypt"]

[[source]]
url    = "https://github.com/linux-pam/linux-pam/releases/download/v1.7.1/Linux-PAM-1.7.1.tar.xz"
sha256 = "21dbcec6e01dd578f14789eac9024a18941e6f2702a05cf91b28c232eeb26ab0"

[build]
configure = '''
export PYTHONPATH=/usr/lib/python3.12/site-packages
CC=gcc meson setup build --prefix=/usr --libdir=lib --sbindir=bin --sysconfdir=/etc --buildtype=release \
    -Ddocs=disabled -Daudit=disabled -Deconf=disabled -Dselinux=disabled -Dopenssl=disabled \
    -Dlogind=disabled -Dpam_userdb=disabled -Dpam_lastlog=disabled -Dexamples=false
'''
compile = "export PYTHONPATH=/usr/lib/python3.12/site-packages; meson compile -C build -j $JOBS"
install = '''
export PYTHONPATH=/usr/lib/python3.12/site-packages
DESTDIR=$DESTDIR meson install -C build
rm -rf "$DESTDIR/usr/share/doc" "$DESTDIR/usr/share/man" "$DESTDIR/var" "$DESTDIR/run"
mkdir -p "$DESTDIR/etc/pam.d"
printf 'auth     required pam_deny.so\naccount  required pam_deny.so\npassword required pam_deny.so\nsession  required pam_deny.so\n' > "$DESTDIR/etc/pam.d/other"
test -e "$DESTDIR/usr/lib/libpam.so.0"
test -e "$DESTDIR/usr/lib/security/pam_unix.so"
test -x "$DESTDIR/usr/bin/unix_chkpwd"
'''
