# e2fsprogs: mkfs.ext4, e2fsck, tune2fs, resize2fs, ... (for ext2/3/4 disks and USB sticks).
name        = "e2fsprogs"
version     = "1.47.2"
description = "ext2/3/4 file system tools"
license     = "GPL-2.0-only AND LGPL-2.0-only"
libc        = ["glibc"]

[depends]
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2",
         "which", "make", "binutils", "gcc", "glibc", "linux-headers", "pkgconf", "util-linux"]

[[source]]
url    = "https://mirrors.edge.kernel.org/pub/linux/kernel/people/tytso/e2fsprogs/v1.47.2/e2fsprogs-1.47.2.tar.gz"
sha256 = "7a959221c1b1cc6e28b7d7a4e204a2ffd8ec6d8a2de4461c482b64c5f4463cca"

[build]
configure = '''
./configure --prefix=/usr --sbindir=/usr/sbin --with-root-prefix=/usr --disable-nls --disable-fsck --disable-uuidd \
    --disable-libuuid --disable-libblkid --disable-e2initrd-helper --without-udev-rules-dir --without-crond-dir \
    --without-systemd-unit-dir CFLAGS='-O2'
'''
compile = "make -j$JOBS"
install = '''
make install DESTDIR=$DESTDIR
rm -rf "$DESTDIR/usr/share" "$DESTDIR/usr/lib/pkgconfig" "$DESTDIR/usr/include" "$DESTDIR/etc"
rm -f "$DESTDIR"/usr/lib/*.a
test -x "$DESTDIR/usr/sbin/mke2fs" && test -x "$DESTDIR/usr/sbin/e2fsck"
'''
