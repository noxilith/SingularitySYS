# Fast, lightweight Wayland terminal emulator
name        = "foot"
version     = "1.25.0_r4"
description = "Fast, lightweight Wayland terminal emulator"
license     = "MIT"
libc        = ["glibc"]

[depends]
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2", "which", "make", "binutils", "gcc", "glibc", "linux-headers", "pkgconf", "python", "ninja", "meson", "fcft", "tllist", "wayland", "wayland-protocols", "libxkbcommon", "pixman", "freetype", "fontconfig", "libpng", "zlib", "expat"]

[[source]]
url    = "https://codeberg.org/dnkl/foot/archive/1.25.0.tar.gz"
sha256 = "ee9d0e51295945157ecb33119cb2c79b276093d0fd342d959d78d772d505571c"

[build]
configure = '''
export PYTHONPATH=/usr/lib/python3.12/site-packages
CC=gcc CXX=g++ meson setup build --prefix=/usr --libdir=lib --sysconfdir=/etc --localstatedir=/var --buildtype=release -Ddocs=disabled -Dgrapheme-clustering=disabled -Dime=true -Dterminfo=disabled
'''
compile   = "export PYTHONPATH=/usr/lib/python3.12/site-packages; meson compile -C build -j $JOBS"
install   = '''
export PYTHONPATH=/usr/lib/python3.12/site-packages
DESTDIR=$DESTDIR meson install -C build
rm -rf "$DESTDIR/usr/share/doc" "$DESTDIR/usr/share/man" "$DESTDIR/var/run" "$DESTDIR/run"
# System default config: the same look as the kitty setup (font, see-through background, Vesper's palette).
mkdir -p "$DESTDIR/etc/xdg/foot"
cat > "$DESTDIR/etc/xdg/foot/foot.ini" <<'FOOTINI'
# SingularitySYS default: same look as the kitty setup (JetBrains Mono Nerd Font, see-through background,
# Vesper's wallpaper palette). Copy to ~/.config/foot/foot.ini to change it.
font=JetBrainsMono Nerd Font Mono:size=11.5
login-shell=yes
locale-override=en_US.UTF-8

[colors]
alpha=0.75
foreground=e1e2e8
background=111418
selection-foreground=00315b
selection-background=a3c9fe
cursor=00315b a3c9fe
urls=d8bde3
regular0=32353a
regular1=ffb4ab
regular2=bbc7db
regular3=d8bde3
regular4=a3c9fe
regular5=543f5e
regular6=3c4758
regular7=c3c6cf
bright0=8d9199
bright1=ffebe8
bright2=e3e8f0
bright3=f1e8f5
bright4=e0edff
bright5=f5d9ff
bright6=d7e3f8
bright7=e1e2e8
FOOTINI

test -e "$DESTDIR/usr/bin/foot"
'''
