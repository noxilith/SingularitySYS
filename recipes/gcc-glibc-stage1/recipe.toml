# Stage 1 GCC for glibc: C and C++ compilers targeting x86_64-unknown-linux-gnu. The compilers themselves are
# static (they start in a sandbox that has no libc); the libraries they build for programs, libgcc_s and
# libstdc++, are SHARED, as on any glibc system. Built by the host compiler because nothing in the store can
# compile for glibc yet; a later stage rebuilds it with itself.
#
# One build, four stages, because the build has no other source of tools:
#   1. cross binutils (only to build gcc; not part of this package)
#   2. a glibc sysroot and the kernel headers (same: build-time only)
#   3. gmp, mpfr and mpc, unpacked inside the gcc source tree
#   4. gcc itself
name        = "gcc-glibc-stage1"
version     = "14.2.0"
description = "GNU Compiler Collection (C, C++) targeting x86_64-unknown-linux-gnu"
license     = "GPL-3.0-or-later WITH GCC-exception-3.1"
libc        = ["glibc"]

[depends]
run = ["binutils-glibc-stage1", "glibc-stage1", "linux-headers-stage0"]

[[source]]
url    = "https://ftp.gnu.org/gnu/gcc/gcc-14.2.0/gcc-14.2.0.tar.xz"
sha256 = "a7b39bc69cbf9e25826c5a60ab26477001f7c08d85cec04bc0e29cabed6f3cc9"

[[source]]
url    = "https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz"
sha256 = "a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898"

[[source]]
url    = "https://ftp.gnu.org/gnu/mpfr/mpfr-4.2.1.tar.xz"
sha256 = "277807353a6726978996945af13e52829e3abd7a9a5b7fb2793894e18f1fcbb2"

[[source]]
url    = "https://ftp.gnu.org/gnu/mpc/mpc-1.3.1.tar.gz"
sha256 = "ab642492f5cf882b74aa0cb730cd410a81edcdbec895183ce930e706c1c759b8"

[[source]]
url    = "https://ftp.gnu.org/gnu/binutils/binutils-2.43.1.tar.xz"
sha256 = "13f74202a3c4c51118b797a39ea4200d3f6cfbe224da6d1d95bb938480132dfd"

[[source]]
url    = "https://ftpmirror.gnu.org/gnu/glibc/glibc-2.42.tar.xz"
sha256 = "d1775e32e4628e64ef930f435b67bb63af7599acb6be2b335b9f19f16509f17f"

[build]
prepare = '''
T=x86_64-unknown-linux-gnu
# ---- 1. cross binutils, used only to build gcc
mkdir -p /build/src-binutils /build/bu
tar --no-same-owner -xJf /sources/binutils-2.43.1.tar.xz -C /build/src-binutils
cd /build/bu
/build/src-binutils/binutils-2.43.1/configure \
    --prefix=/build/cross --target=$T --with-sysroot=/build/sysroot \
    --disable-nls --disable-multilib --disable-werror --disable-gprofng \
    --disable-plugins --enable-deterministic-archives --without-zstd \
    CC='gcc -std=gnu17' MAKEINFO=true
make -j"$JOBS" MAKEINFO=true
make DESTDIR= MAKEINFO=true install

# ---- 2. a glibc sysroot (merged /usr, like the glibc-stage1 package) and the kernel headers
mkdir -p /build/src-glibc /build/glibc-build
tar --no-same-owner -xJf /sources/glibc-2.42.tar.xz -C /build/src-glibc
cd /build/glibc-build
cat > configparms <<CFG
slibdir=/usr/lib
rtlddir=/usr/lib
sbindir=/usr/bin
rootsbindir=/usr/bin
CFG
/build/src-glibc/glibc-2.42/configure \
    --prefix=/usr --libdir=/usr/lib --libexecdir=/usr/lib/glibc --sysconfdir=/etc \
    --enable-kernel=4.19 --enable-stack-protector=no --disable-werror --disable-nscd --disable-profile --disable-crypt \
    --without-gd --without-selinux --with-headers=/usr/include \
    CFLAGS='-O2 -g1 -pipe' libc_cv_slibdir=/usr/lib
make -j"$JOBS"
make install_root=/build/sysroot install
mkdir -p /build/sysroot/usr/include
ln -s usr/lib /build/sysroot/lib
ln -s usr/lib /build/sysroot/lib64
for d in asm asm-generic drm linux misc mtd rdma sound video xen; do
    for base in /usr/include /usr/include/x86_64-linux-gnu; do
        if [ -d "$base/$d" ]; then cp -R "$base/$d" /build/sysroot/usr/include/; break; fi
    done
done

# ---- 3. gmp, mpfr and mpc inside the gcc source tree, so gcc builds them itself
cd "$SRC"
tar --no-same-owner -xJf /sources/gmp-6.3.0.tar.xz && mv gmp-6.3.0 gmp
tar --no-same-owner -xJf /sources/mpfr-4.2.1.tar.xz && mv mpfr-4.2.1 mpfr
tar --no-same-owner -xzf /sources/mpc-1.3.1.tar.gz && mv mpc-1.3.1 mpc

# ---- 4. libraries go in /usr/lib (merged /usr), not lib64: gcc searches and installs there
sed -i 's|m64=\.\./lib64|m64=../lib|' "$SRC/gcc/config/i386/t-linux64"
if [ "$(grep -c 'm64=\.\./lib64' "$SRC/gcc/config/i386/t-linux64" || true)" != 0 ]; then
    echo "could not switch gcc's 64-bit library directory to lib" >&2
    exit 1
fi
'''

configure = '''
export PATH=/build/cross/bin:$PATH
mkdir -p /build/gcc-build
cd /build/gcc-build
"$SRC/configure" \
    --prefix=/usr \
    --target=x86_64-unknown-linux-gnu \
    --with-sysroot=/ --with-build-sysroot=/build/sysroot \
    --with-native-system-header-dir=/usr/include \
    --enable-languages=c,c++ \
    --disable-multilib --disable-nls --disable-bootstrap --disable-werror \
    --enable-shared --enable-default-pie --enable-default-ssp --disable-plugin --disable-lto \
    --disable-libsanitizer --disable-libquadmath --disable-libgomp \
    --disable-libitm --disable-libvtv --disable-libstdcxx-pch \
    --enable-threads=posix --enable-tls --enable-__cxa_atexit --enable-clocale=gnu \
    --with-arch=x86-64 --with-tune=generic \
    CC='gcc -std=gnu17' CXX='g++ -std=gnu++17' LDFLAGS=--static MAKEINFO=true
'''

compile = '''
export PATH=/build/cross/bin:$PATH
cd /build/gcc-build
make -j"$JOBS" MAKEINFO=true
'''

install = '''
export PATH=/build/cross/bin:$PATH
T=x86_64-unknown-linux-gnu
cd /build/gcc-build
make DESTDIR=$DESTDIR MAKEINFO=true install-strip

cd "$DESTDIR/usr/bin"
ln -sf $T-gcc $T-gcc-14.2.0
ln -sf $T-g++ $T-c++
for t in gcc g++ c++ cpp gcc-ar gcc-nm gcc-ranlib; do
    if [ -e "$T-$t" ]; then ln -sf "$T-$t" "$t"; fi
done
ln -sf $T-gcc cc
rm -rf "$DESTDIR/usr/share/info" "$DESTDIR/usr/share/man" "$DESTDIR/usr/share/gdb"

# Self-checks: the compilers must be fully static; the target libraries must exist.
for f in "$DESTDIR/usr/bin/$T-gcc" "$DESTDIR/usr/bin/$T-g++" \
         "$DESTDIR"/usr/libexec/gcc/$T/14.2.0/cc1 \
         "$DESTDIR"/usr/libexec/gcc/$T/14.2.0/cc1plus \
         "$DESTDIR"/usr/libexec/gcc/$T/14.2.0/collect2; do
    if [ "$(readelf -lW "$f" | grep -c INTERP || true)" != 0 ]; then
        echo "$f is dynamically linked, but this package must be static" >&2
        exit 1
    fi
done
# A cross-style install puts the target libraries in usr/$T/lib. The shared ones must be where the dynamic
# loader looks, in usr/lib; the static archives stay where gcc finds them.
mkdir -p "$DESTDIR/usr/lib"
for f in "$DESTDIR"/usr/$T/lib/*.so*; do
    if [ -e "$f" ] || [ -L "$f" ]; then mv "$f" "$DESTDIR/usr/lib/"; fi
done
test -f "$DESTDIR/usr/lib/gcc/$T/14.2.0/libgcc.a"
ls "$DESTDIR"/usr/lib/libgcc_s.so.1 "$DESTDIR"/usr/lib/libstdc++.so.6 >/dev/null
'''
