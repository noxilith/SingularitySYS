# file: tells what kind of data a file holds (libmagic and its magic database).
name        = "file"
version     = "5.48"
description = "Determine the type of a file from its contents"
license     = "BSD-2-Clause"
libc        = ["glibc"]

[depends]
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2",
         "which", "make", "binutils", "gcc", "glibc", "linux-headers", "zlib"]

[[source]]
url    = "https://astron.com/pub/file/file-5.48.tar.gz"
sha256 = "ed14656883b23a364b4057c05595d93252da9bc473d30106519519d0da141283"

[build]
configure = "./configure --prefix=/usr --disable-static --disable-dependency-tracking --disable-bzlib --disable-xzlib --disable-zstdlib --disable-lzlib CFLAGS='-O2'"
compile   = "make -j$JOBS"
install   = '''
make install DESTDIR=$DESTDIR
rm -f "$DESTDIR/usr/lib/libmagic.la"
strip "$DESTDIR/usr/bin/file" 2>/dev/null || true
test -x "$DESTDIR/usr/bin/file"
test -f "$DESTDIR/usr/share/misc/magic.mgc"
'''
