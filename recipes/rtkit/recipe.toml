# Realtime scheduling for audio (PipeWire asks it for real-time priority)
name        = "rtkit"
version     = "0.13_r1"
description = "Realtime scheduling for audio (PipeWire asks it for real-time priority)"
license     = "GPL-3.0-or-later"
libc        = ["glibc"]

[depends]
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2", "which", "make", "binutils", "gcc", "glibc", "linux-headers", "pkgconf", "python", "ninja", "meson", "vim", "dbus", "libcap", "systemd", "polkit", "glib", "duktape", "expat", "linux-pam"]

[[source]]
url    = "https://github.com/heftig/rtkit/archive/refs/tags/v0.13.tar.gz"
sha256 = "0f9508530868109f0348e044cc1b20893672875467ace6d847ba6364274de003"

[build]
configure = '''
export PYTHONPATH=/usr/lib/python3.12/site-packages
CC=gcc CXX=g++ meson setup build --prefix=/usr --libdir=lib --sysconfdir=/etc --localstatedir=/var --buildtype=release 
'''
compile   = "export PYTHONPATH=/usr/lib/python3.12/site-packages; meson compile -C build -j $JOBS"
install   = '''
export PYTHONPATH=/usr/lib/python3.12/site-packages
DESTDIR=$DESTDIR meson install -C build
rm -rf "$DESTDIR/usr/share/doc" "$DESTDIR/usr/share/man" "$DESTDIR/var/run" "$DESTDIR/run"

mkdir -p "$DESTDIR/usr/lib/sysusers.d"
printf 'u rtkit - "RealtimeKit" /proc /usr/sbin/nologin\n' > "$DESTDIR/usr/lib/sysusers.d/rtkit.conf"
test -e "$DESTDIR/usr/libexec/rtkit-daemon"
'''
