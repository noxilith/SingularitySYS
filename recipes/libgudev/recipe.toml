# GObject bindings for libudev
name        = "libgudev"
version     = "238"
description = "GObject bindings for libudev"
license     = "LGPL-2.1-or-later"
libc        = ["glibc"]

[depends]
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2", "which", "make", "binutils", "gcc", "glibc", "linux-headers", "pkgconf", "python", "ninja", "meson", "glib", "systemd", "libffi", "pcre2", "zlib"]

[[source]]
url    = "https://download.gnome.org/sources/libgudev/238/libgudev-238.tar.xz"
sha256 = "61266ab1afc9d73dbc60a8b2af73e99d2fdff47d99544d085760e4fa667b5dd1"

[build]
configure = '''
export PYTHONPATH=/usr/lib/python3.12/site-packages
CC=gcc CXX=g++ meson setup build --prefix=/usr --libdir=lib --sysconfdir=/etc --localstatedir=/var --buildtype=release -Dtests=disabled -Dintrospection=disabled -Dvapi=disabled -Dgtk_doc=false
'''
compile   = "export PYTHONPATH=/usr/lib/python3.12/site-packages; meson compile -C build -j $JOBS"
install   = '''
export PYTHONPATH=/usr/lib/python3.12/site-packages
DESTDIR=$DESTDIR meson install -C build
rm -rf "$DESTDIR/usr/share/doc" "$DESTDIR/usr/share/man" "$DESTDIR/var/run" "$DESTDIR/run"

test -e "$DESTDIR/usr/lib/libgudev-1.0.so.0"
'''
