name        = "grep"
version     = "3.11"
description = "GNU grep"
license     = "GPL-3.0-or-later"
libc        = ["musl"]

[depends]
build = ["busybox", "make", "binutils", "gcc", "musl", "linux-headers"]

[[source]]
url    = "https://ftp.gnu.org/gnu/grep/grep-3.11.tar.xz"
sha256 = "1db2aedde89d0dea42b16d9528f894c8d15dae4e190b59aecc78f5a951276eab"

[build]
configure = '''
export FORCE_UNSAFE_CONFIGURE=1
./configure --prefix=/usr --disable-nls --disable-perl-regexp --disable-dependency-tracking CFLAGS='-O2 -std=gnu17' LDFLAGS=--static
'''
compile   = "make -j$JOBS"
install   = '''
make DESTDIR=$DESTDIR install
rm -rf "$DESTDIR/usr/share/man" "$DESTDIR/usr/share/info" "$DESTDIR/usr/share/locale" "$DESTDIR/usr/share/doc" "$DESTDIR/usr/lib/charset.alias"
for f in "$DESTDIR"/usr/bin/* "$DESTDIR"/usr/sbin/* "$DESTDIR"/usr/libexec/*; do
    [ -f "$f" ] && [ ! -L "$f" ] || continue
    strip "$f" 2>/dev/null || true
    if readelf -lW "$f" 2>/dev/null | grep -q INTERP; then echo "$f is dynamic" >&2; exit 1; fi
done
test "$(echo abc | "$DESTDIR/usr/bin/grep" -o b)" = b
'''
