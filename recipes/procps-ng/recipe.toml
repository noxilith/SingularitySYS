# procps-ng: ps, top, free, pgrep, pkill, uptime, w, watch, vmstat, sysctl, ... (what BusyBox used to provide, GNU style).
# kill comes from util-linux. No systemd or NUMA support.
name        = "procps-ng"
version     = "4.0.5"
description = "Process and system utilities: ps, top, free, pgrep, pkill, uptime, watch, sysctl"
license     = "GPL-2.0-or-later AND LGPL-2.1-or-later"
libc        = ["glibc"]

[depends]
build = ["busybox", "make", "binutils", "gcc", "glibc", "linux-headers", "ncurses", "pkgconf"]

[[source]]
url    = "https://downloads.sourceforge.net/project/procps-ng/Production/procps-ng-4.0.5.tar.xz"
sha256 = "c2e6d193cc78f84cd6ddb72aaf6d5c6a9162f0470e5992092057f5ff518562fa"

[build]
configure = '''
./configure --prefix=/usr --bindir=/usr/bin --sbindir=/usr/sbin --libdir=/usr/lib --disable-static --disable-nls \
    --disable-kill --disable-numa --without-systemd --without-elogind --disable-modern-top --disable-dependency-tracking \
    NCURSES_CFLAGS='-I/usr/include' NCURSES_LIBS='-lncursesw -ltinfow' CFLAGS='-O2'
'''
compile = "make -j$JOBS"
install = '''
make install DESTDIR=$DESTDIR
rm -rf "$DESTDIR/usr/share" "$DESTDIR/usr/include" "$DESTDIR/usr/lib/pkgconfig"
rm -f "$DESTDIR"/usr/lib/*.la
test -x "$DESTDIR/usr/bin/ps" && test -x "$DESTDIR/usr/bin/top" && test -x "$DESTDIR/usr/sbin/sysctl"
'''
