# iputils: ping, tracepath, arping.
name        = "iputils"
version     = "20240905"
description = "ping, tracepath, arping"
license     = "GPL-2.0-or-later AND BSD-3-Clause"
libc        = ["glibc"]

[depends]
build = ["busybox", "make", "binutils", "gcc", "glibc", "linux-headers", "pkgconf", "python", "ninja", "meson"]

[[source]]
url    = "https://github.com/iputils/iputils/archive/refs/tags/20240905.tar.gz"
sha256 = "055b4e6e4f298c97fd5848898099e59b4590db63fac3f7ad4fa796354ad44403"

[build]
configure = '''
export PYTHONPATH=/usr/lib/python3.12/site-packages
CC=gcc meson setup build --prefix=/usr --bindir=bin --sbindir=sbin --buildtype=release -DBUILD_MANS=false -DBUILD_HTML_MANS=false \
    -DUSE_CAP=false -DUSE_IDN=false -DUSE_GETTEXT=false -DNO_SETCAP_OR_SUID=true -DSKIP_TESTS=true -DBUILD_ARPING=true \
    -DBUILD_PING=true -DBUILD_TRACEPATH=true -DBUILD_CLOCKDIFF=false -DBUILD_RARPD=false -DBUILD_RDISC=false \
    -DBUILD_TFTPD=false -DBUILD_TRACEROUTE6=false -DBUILD_NINFOD=false
'''
compile = "meson compile -C build -j $JOBS"
install = '''
DESTDIR=$DESTDIR meson install -C build
rm -rf "$DESTDIR/usr/share"
test -x "$DESTDIR/usr/bin/ping"
'''
