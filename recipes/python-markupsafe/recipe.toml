# MarkupSafe (pure Python fallback, no C speedups): Jinja2 needs it.
name        = "python-markupsafe"
version     = "3.0.4_r1"
description = "Safely add untrusted strings to HTML/XML markup"
license     = "BSD-3-Clause"
libc        = ["glibc"]

[depends]
build = ["busybox", "python"]
run   = ["python"]

[[source]]
url    = "https://files.pythonhosted.org/packages/38/9b/e422a865e1d5d57d0e509b4e0bf1c1a70a7f6382c29a5aa428df994c8bc8/markupsafe-3.0.4.tar.gz"
sha256 = "2e9ad7dd851bf45fab9f75cbff4cb493fee9979e8d8c7c9c3ee119022518edd6"

[build]
install = '''
site="$DESTDIR/usr/lib/python3.12/site-packages"
mkdir -p "$site"
cp -R src/markupsafe "$site/markupsafe"
find "$site" -name '*.c' -delete
test -f "$site/markupsafe/__init__.py"
'''
