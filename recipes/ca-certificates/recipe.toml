# The Mozilla root certificates, so that programs can check HTTPS servers (curl, wpa_supplicant's EAP, ...).
# Taken from the `certifi` source release (PyPI), which ships Mozilla's bundle and is pinned by hash here.
name        = "ca-certificates"
version     = "2026.10.23"
description = "Mozilla CA root certificate bundle"
license     = "MPL-2.0"
libc        = ["glibc"]

[depends]
build = ["busybox"]

[[source]]
url    = "https://files.pythonhosted.org/packages/fd/11/b524cbd9bbdaca58608e4cf4053fd463417549e1959fa8d3aa18319f9555/certifi-2026.10.23.tar.gz"
sha256 = "a9895e6e2758b371e0545e321a3a8fd1fcfd9829ada8824a936dfb16aaaf36cd"

[build]
install = '''
mkdir -p "$DESTDIR/etc/ssl/certs"
cp certifi/cacert.pem "$DESTDIR/etc/ssl/certs/ca-certificates.crt"
ln -s certs/ca-certificates.crt "$DESTDIR/etc/ssl/cert.pem"
test "$(grep -c 'BEGIN CERTIFICATE' "$DESTDIR/etc/ssl/certs/ca-certificates.crt")" -gt 100
'''
