# PCRE2: Perl-compatible regular expressions (glib needs it). Headers and pkg-config files are kept.
name        = "pcre2"
version     = "10.49"
description = "Perl-compatible regular expression library"
license     = "BSD-3-Clause"
libc        = ["glibc"]

[depends]
build = ["busybox", "make", "binutils", "gcc", "glibc", "linux-headers"]

[[source]]
url    = "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.49/pcre2-10.49.tar.bz2"
sha256 = "53c156e1ba416a20da8e65395daa132da0d80e76910424caca3fcdae7831d384"

[build]
configure = "./configure --prefix=/usr --libdir=/usr/lib --disable-static --enable-unicode --enable-jit --disable-dependency-tracking CFLAGS='-O2'"
compile   = "make -j$JOBS"
install   = '''
make install DESTDIR=$DESTDIR
rm -rf "$DESTDIR/usr/share" "$DESTDIR"/usr/lib/*.la
test -f "$DESTDIR/usr/lib/libpcre2-8.so.0"
'''
