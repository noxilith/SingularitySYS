# less: the pager.
name        = "less"
version     = "668_r1"
description = "The less pager"
license     = "GPL-3.0-or-later OR BSD-2-Clause"
libc        = ["glibc"]

[depends]
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2",
         "which", "make", "binutils", "gcc", "glibc", "linux-headers", "ncurses"]

[[source]]
url    = "https://www.greenwoodsoftware.com/less/less-668.tar.gz"
sha256 = "2819f55564d86d542abbecafd82ff61e819a3eec967faa36cd3e68f1596a44b8"

[build]
configure = "./configure --prefix=/usr --with-regex=posix LIBS='-lncursesw -ltinfow' CFLAGS='-O2'"
compile   = "make -j$JOBS"
install   = '''
make install DESTDIR=$DESTDIR
find "$DESTDIR/usr/share" -mindepth 1 -maxdepth 1 ! -name man -exec rm -rf {} + 2>/dev/null || true
test -x "$DESTDIR/usr/bin/less"
'''
