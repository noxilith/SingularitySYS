# Power and battery information service
name        = "upower"
version     = "1.91.0"
description = "Power and battery information service"
license     = "GPL-2.0-or-later"
libc        = ["glibc"]

[depends]
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2", "which", "make", "binutils", "gcc", "glibc", "linux-headers", "pkgconf", "python", "ninja", "meson", "glib", "libgudev", "systemd", "dbus", "libffi", "pcre2", "zlib", "polkit", "duktape", "expat", "linux-pam"]

[[source]]
url    = "https://gitlab.freedesktop.org/upower/upower/-/archive/v1.91.0/upower-v1.91.0.tar.gz"
sha256 = "0b4808827bdc742e8bc65cc12e035dc9b526a246eae18e2509841a7e891eab9e"

[build]
configure = '''
export PYTHONPATH=/usr/lib/python3.12/site-packages
# no gettext here: a msgfmt that only does what merge_file needs (copy the template, untranslated)
mkdir -p /build/shim
cat > /build/shim/msgfmt <<'SH'
#!/bin/sh
tmpl=; out=
while [ $# -gt 0 ]; do case "$1" in --template) tmpl=$2; shift;; -o) out=$2; shift;; --version) echo "msgfmt (shim) 0.22"; exit 0;; esac; shift; done
if [ -n "$tmpl" ]; then cp "$tmpl" "$out"; elif [ -n "$out" ]; then : > "$out"; fi
SH
chmod 755 /build/shim/msgfmt
export PATH=/build/shim:$PATH
CC=gcc CXX=g++ meson setup build --prefix=/usr --libdir=lib --sysconfdir=/etc --localstatedir=/var --buildtype=release -Dgtk-doc=false -Dintrospection=disabled -Dman=false -Didevice=disabled -Dsystemdsystemunitdir=/usr/lib/systemd/system -Dudevrulesdir=/usr/lib/udev/rules.d
'''
compile   = "export PATH=/build/shim:$PATH PYTHONPATH=/usr/lib/python3.12/site-packages; meson compile -C build -j $JOBS"
install   = '''
export PYTHONPATH=/usr/lib/python3.12/site-packages
export PATH=/build/shim:$PATH
DESTDIR=$DESTDIR meson install -C build
rm -rf "$DESTDIR/usr/share/doc" "$DESTDIR/usr/share/man" "$DESTDIR/var/run" "$DESTDIR/run"
mkdir -p "$DESTDIR/etc/init.d"
printf "#!/sbin/openrc-run\ndescription=\"UPower\"\ncommand=/usr/libexec/upowerd\ncommand_background=true\npidfile=/run/upowerd.pid\ndepend() { need dbus; }\n" > "$DESTDIR/etc/init.d/upower"
chmod 755 "$DESTDIR/etc/init.d/upower"
test -e "$DESTDIR/usr/libexec/upowerd"
'''
