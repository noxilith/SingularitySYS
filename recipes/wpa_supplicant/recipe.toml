# wpa_supplicant 2.12 on OpenSSL: WPA2 personal, WPA3 (SAE, including WPA3-only networks), OWE, and the
# common WPA-Enterprise methods (PEAP, TTLS, MSCHAPv2, GTC, TLS). nl80211 only.
name        = "wpa_supplicant"
version     = "2.12_r3"
description = "Wi-Fi supplicant (wpa_supplicant, wpa_cli, wpa_passphrase)"
license     = "BSD-3-Clause"
libc        = ["glibc"]

[depends]
build = ["bash", "dash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "gzip", "xz", "bzip2",
         "which", "make", "binutils", "gcc", "glibc", "linux-headers", "pkgconf", "libnl", "openssl", "dbus"]

[[source]]
url    = "https://w1.fi/releases/wpa_supplicant-2.12.tar.gz"
sha256 = "08e23937e16d0155e55cab2b51f51fbe10d80a1aa91c4e15442645059b737ef6"

[build]
configure = '''
cd wpa_supplicant
cat > .config <<'CONF'
CONFIG_DRIVER_NL80211=y
CONFIG_LIBNL32=y
CONFIG_CTRL_IFACE=y
CONFIG_CTRL_IFACE_DBUS_NEW=y
CONFIG_CTRL_IFACE_DBUS_INTRO=y
CONFIG_BACKEND=file
CONFIG_TLS=openssl
CONFIG_SAE=y
CONFIG_OWE=y
CONFIG_IEEE80211W=y
CONFIG_IEEE80211N=y
CONFIG_IEEE80211AC=y
CONFIG_IEEE80211AX=y
CONFIG_EAP_MD5=y
CONFIG_EAP_MSCHAPV2=y
CONFIG_EAP_TLS=y
CONFIG_EAP_PEAP=y
CONFIG_EAP_TTLS=y
CONFIG_EAP_GTC=y
CONFIG_PKCS12=y
CONFIG_SMARTCARD=n
CONF
'''
compile = "make -C wpa_supplicant -j$JOBS CC=gcc"
install = '''
mkdir -p "$DESTDIR/usr/sbin" "$DESTDIR/usr/bin"
install -m 755 wpa_supplicant/wpa_supplicant wpa_supplicant/wpa_cli "$DESTDIR/usr/sbin/"
install -m 755 wpa_supplicant/wpa_passphrase "$DESTDIR/usr/bin/"
strip "$DESTDIR"/usr/sbin/wpa_supplicant "$DESTDIR"/usr/sbin/wpa_cli "$DESTDIR"/usr/bin/wpa_passphrase
# D-Bus interface: NetworkManager (the desktop's network manager) drives Wi-Fi through it. The bus starts the daemon on demand.
mkdir -p "$DESTDIR/usr/share/dbus-1/system.d" "$DESTDIR/usr/share/dbus-1/system-services"
install -m 644 wpa_supplicant/dbus/dbus-wpa_supplicant.conf "$DESTDIR/usr/share/dbus-1/system.d/wpa_supplicant.conf"
printf "[D-BUS Service]\nName=fi.w1.wpa_supplicant1\nExec=/usr/sbin/wpa_supplicant -u -O /run/wpa_supplicant\nUser=root\nSystemdService=wpa_supplicant.service\n" > "$DESTDIR/usr/share/dbus-1/system-services/fi.w1.wpa_supplicant1.service"
# systemd: the bus activates the daemon through this unit (the setuid launch helper is not available in the store)
mkdir -p "$DESTDIR/usr/lib/systemd/system"
printf "[Unit]\nDescription=WPA supplicant (D-Bus, used by NetworkManager)\n\n[Service]\nType=dbus\nBusName=fi.w1.wpa_supplicant1\nExecStart=/usr/sbin/wpa_supplicant -u -O /run/wpa_supplicant\n" > "$DESTDIR/usr/lib/systemd/system/wpa_supplicant.service"
test -f "$DESTDIR/usr/share/dbus-1/system.d/wpa_supplicant.conf"
'''
